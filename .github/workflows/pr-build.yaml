name: PR build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.3.4
        with:
          lfs: true

      - uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: '17'

      - name: Build
        run: ./gradlew build -x test

      - uses: actions/upload-artifact@v4
        with:
          name: logger-plus-plus-pr${{ github.event.pull_request.number }}
          path: releases/*.jar
          retention-days: 14
